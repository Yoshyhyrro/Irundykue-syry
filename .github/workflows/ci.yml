name: CI

on:
  push:
    branches: [ feature/configuration_file ]
  pull_request:
    branches: [ feature/configuration_file ]
  workflow_dispatch:

jobs:
  verify-and-build:
    name: Verify (Idris 2) and Cross-Compile (Zig Baremetal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm \
            chezscheme \
            clang \
            libgmp-dev

      # build.zig targets the Zig 0.15+ build API and was verified with 0.17.0.
      # Keep this pin in sync with the version used locally.
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Setup Idris 2 Cache
        id: cache-idris2
        uses: actions/cache@v4
        with:
          path: ~/.idris2
          key: idris2-v0.8.0-chezscheme

      - name: Bootstrap and Install Idris 2
        if: steps.cache-idris2.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v0.8.0 https://github.com/idris-lang/Idris2.git /tmp/Idris2
          cd /tmp/Idris2
          SCHEME_BIN=$(which chezscheme || which chez || which scheme)
          make bootstrap SCHEME="$SCHEME_BIN"
          make install
          rm -rf /tmp/Idris2

      - name: Configure Idris 2 Environment
        run: |
          echo "$HOME/.idris2/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$HOME/.idris2/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Check Toolchain Versions
        run: |
          idris2 --version
          zig version

      - name: Typecheck and Build Idris 2 Package
        run: |
          idris2 --build irundykue.ipkg

      - name: Prepare Generated Directories
        run: |
          mkdir -p generated

      - name: Build Bare-Metal AArch64 Kernel with Zig
        run: |
          zig build

      - name: Inspect Kernel Artifacts
        run: |
          ls -la zig-out/bin/
          file zig-out/bin/irundykue-syry.elf

      # Without virtualization=on the QEMU virt machine enters the kernel at
      # EL1, which is what boot.S expects. The kernel parks in a WFE loop, so
      # a timeout (exit status 124) is the expected outcome; the banner proves
      # that the boot path ran and that it ran at EL1.
      #
      # "-nic none" drops the default virtio-net device. Its option ROM
      # (efi-virtio.rom) comes from ipxe-qemu, which "--no-install-recommends"
      # does not install, and a bare-metal smoke test needs no network.
      - name: Run QEMU Emulation Smoke Test
        shell: bash
        run: |
          status=0
          timeout 5s qemu-system-aarch64 \
            -M virt \
            -cpu max \
            -smp 4 \
            -m 512M \
            -nographic \
            -nic none \
            -kernel zig-out/bin/irundykue-syry.elf > qemu.log 2>&1 || status=$?
          cat qemu.log
          [ "$status" -eq 124 ]
          grep -q "cold boot at EL1" qemu.log

      # The kernel does not interpret Forth yet: it echoes an inserted file back
      # and powers the machine off. This step proves that the whole insertion
      # path (header, QEMU loader, kernel reader, UART) delivers the bytes.
      # Remove it once the interpreter replaces the echo.
      - name: Insertion Round-Trip Test
        shell: bash
        run: |
          printf '\\ round trip\n1 2 + .\n' > "$RUNNER_TEMP/roundtrip.tatatina"
          bash ./irundykue run "$RUNNER_TEMP/roundtrip.tatatina" \
            --timeout 20 --expect '1 2 \+ \.'

      # Golden-output tests in test/. Tests listed in test/XFAIL are known to
      # fail and are reported as XFAIL; a listed test that starts to pass is an
      # error (XPASS) so that the list is kept honest.
      - name: Run Test Suite
        shell: bash
        run: |
          bash ./irundykue --version
          bash ./irundykue test

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: irundykue-baremetal-binaries
          path: |
            zig-out/bin/irundykue-syry.elf
            zig-out/bin/irundykue-syry.bin
          if-no-files-found: error